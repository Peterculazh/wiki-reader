name: test

on:
    pull_request:
    push:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        env:
            KAFKA_BROKERS: localhost:9092
            DATABASE_URL: postgres://unused
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm test
            - run: npm run test:int
            - run: npm run test:e2e -- apps/stats
