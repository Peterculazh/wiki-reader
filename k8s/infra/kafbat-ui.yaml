# Kafka web UI. No Ingress: reach it with
#   kubectl -n wiki port-forward svc/kafbat-ui 8080:8080   ->  http://localhost:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafbat-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafbat-ui
  template:
    metadata:
      labels:
        app: kafbat-ui
    spec:
      containers:
        - name: kafbat-ui
          image: ghcr.io/kafbat/kafka-ui:v1.5.0
          ports:
            - name: http
              containerPort: 8080
          env:
            # Spring Boot maps these to kafka.clusters[0].name / .bootstrapServers,
            # the same settings compose reads from kui/config.yml
            - name: KAFKA_CLUSTERS_0_NAME
              value: wiki
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: wiki-kafka-bootstrap:9092
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 768Mi
          # A JVM app: give it up to a minute to start before liveness counts
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafbat-ui
spec:
  selector:
    app: kafbat-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
