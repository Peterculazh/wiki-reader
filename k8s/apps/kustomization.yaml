# The apps, their config and the archiver's autoscaler.
# Apply once k8s/infra is ready:  kubectl apply -k k8s/apps
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wiki
resources:
  - config.yaml
  - ingester.yaml
  - archiver.yaml
  - bursts.yaml
  - archiver-scaledobject.yaml
  - api.yaml
  - web.yaml
