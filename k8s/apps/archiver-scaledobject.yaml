# KEDA scales the archiver on its consumer lag. KEDA itself only reads the lag
# and feeds it to an HPA it creates (keda-hpa-archiver), which sets the
# Deployment's replicas: desired = ceil(total lag / lagThreshold), within min..max.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: archiver
spec:
  scaleTargetRef:
    name: archiver
  # No pollingInterval / cooldownPeriod: with minReplicaCount >= 1 both only
  # matter for scaling to and from 0 (KEDA warns if they're set). Scaling 1..3
  # is the HPA's job: it asks KEDA for the lag every 15 s (its sync period) and
  # waits out its own stabilization window before scaling down (set below).
  minReplicaCount: 1
  # = partitions of wiki.changes. A 4th consumer would get no partition and sit
  # idle; KEDA caps at the partition count anyway unless allowIdleConsumers is set.
  maxReplicaCount: 3
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # The HPA waits 300 s by default before scaling down, to avoid flapping
          stabilizationWindowSeconds: 30
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: wiki-kafka-bootstrap.wiki.svc:9092
        consumerGroup: archiver
        topic: wiki.changes
        # Not 500: the archiver commits only after a whole 300-message chunk is
        # stored (or after 60 s), so even with no backlog its lag swings between 0
        # and ~3 x 300 = 900. A threshold below that would keep a second replica
        # running for nothing. 1000 means: scale out once there is a real backlog.
        lagThreshold: "1000"
        # The archiver starts a new group at the beginning (fromBeginning: true),
        # so a partition without a committed offset counts its whole retained log as lag
        offsetResetPolicy: earliest
