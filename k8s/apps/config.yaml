# Environment for all the apps, web included (each reads only what it needs).
# Loaded with envFrom, so these are real environment variables: they win over any
# .env file (there is none in the image), and the archiver's import-time
# process.env reads see them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wiki-reader-config
data:
  # Strimzi's bootstrap Service. One name is enough here: it load-balances over
  # all brokers, and the client learns every broker's address from metadata.
  KAFKA_BROKERS: wiki-kafka-bootstrap:9092
  S3_ENDPOINT: http://seaweedfs:8333
  S3_REGION: us-east-1
  S3_BUCKET: wiki-archive
  # App defaults, spelled out so they're easy to tweak. Set BURST_MIN_AUTHORS to
  # "2" to see bursts sooner; then restart: kubectl -n wiki rollout restart deploy/bursts
  BURST_WINDOW_MS: "600000"
  BURST_MIN_AUTHORS: "3"
  BURST_COOLDOWN_MS: "3600000"
  BURST_MAX_LAG_MS: "900000"
  BURST_EVICT_INTERVAL_MS: "60000"
  # api: the origin the browser shows the dashboard at, allowed to open GET /live.
  # That's the web port-forward from the README.
  WEB_ORIGIN: http://localhost:3000
  # web: where its server components reach the api, read per request. The
  # browser's address for the api is baked into the web image instead
  # (NEXT_PUBLIC_API_URL, see apps/web/Dockerfile).
  API_URL: http://api:3000
---
# Credentials go in a Secret rather than the ConfigMap, so RBAC can restrict who
# reads them. Secrets are only base64-encoded, not encrypted; these are the local
# SeaweedFS dev keys from seaweedfs/s3.json, fine to keep in git.
apiVersion: v1
kind: Secret
metadata:
  name: wiki-reader-s3
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: dev
  S3_SECRET_ACCESS_KEY: devsecret
