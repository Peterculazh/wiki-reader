x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: broker,controller
  CLUSTER_ID: kafka-cluster
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # Local dev: cap each partition at 1 GiB on top of the 7-day time limit.
  # Without it the 3 replicas of a ~30 events/s stream grow by roughly 10 GB a
  # day, and a full Docker disk turns the brokers' filesystem read-only.
  # wiki.changes holds about a day of events this way; wiki.bursts is tiny and
  # still keeps 7 days. Smaller segments (default 1 GiB) let retention delete
  # in 100 MiB steps instead of keeping up to twice the cap.
  KAFKA_LOG_RETENTION_BYTES: 1073741824
  KAFKA_LOG_SEGMENT_BYTES: 104857600

services:
  kafka-1:
    image: apache/kafka:4.3.1
    container_name: kafka-1
    ports:
      - 9092:9092
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
  kafka-2:
    image: apache/kafka:4.3.1
    container_name: kafka-2
    ports:
      - 9094:9092
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9094
  kafka-3:
    image: apache/kafka:4.3.1
    container_name: kafka-3
    ports:
      - 9096:9092
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9096
  kafbat-ui:
    container_name: kafbat-ui
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - 8080:8080
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
    volumes:
      # Must be an existing file: if missing, Docker creates a directory and the UI crashes
      - ./kui/config.yml:/etc/kafkaui/dynamic_config.yaml
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    container_name: seaweedfs
    # Local-dev S3 only: master + volume + filer + S3 gateway in one process
    command: server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - ${S3_PORT:-8333}:8333
      # Filer UI for browsing buckets
      - ${SEAWEEDFS_FILER_PORT:-8888}:8888
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data
  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wiki}
      POSTGRES_DB: ${POSTGRES_DB:-wiki}
    healthcheck:
      # $$ so the variables are expanded inside the container, not by Compose
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      # Postgres 18+ images keep data in /var/lib/postgresql/<major>/docker, so the
      # volume goes on the parent dir (mounting .../data like older images fails)
      - postgres-data:/var/lib/postgresql/data

volumes:
  seaweedfs-data:
  postgres-data:
